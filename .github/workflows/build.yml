name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration de Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Création du projet Android natif (Wrapper WebView)
        run: |
          # Création des dossiers
          mkdir -p app/src/main/java/com/orbitalgps
          mkdir -p app/src/main/assets/www
          
          # Copie de vos fichiers web dans l'APK
          cp index.html app/src/main/assets/www/
          [ -f manifest.json ] && cp manifest.json app/src/main/assets/www/
          [ -f icon-192.png ] && cp icon-192.png app/src/main/assets/www/
          [ -f icon-512.png ] && cp icon-512.png app/src/main/assets/www/
          
          # Renommage du service worker pour correspondre au code HTML
          if [ -f sw.js ]; then cp sw.js app/src/main/assets/www/service-worker.js; fi

          # Fichier settings.gradle
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OrbitalGPS"
          include ':app'
          EOF

          # Fichier build.gradle (racine)
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          # Fichier app/build.gradle
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.orbitalgps'
              compileSdk 34
              defaultConfig {
                  applicationId "com.orbitalgps"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:label="OrbitalGPS"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java
          cat > app/src/main/java/com/orbitalgps/MainActivity.java <<'EOF'
          package com.orbitalgps;

          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setGeolocationEnabled(true);
                  
                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();
                      
                  webView.setWebViewClient(new WebViewClientCompat() {
                      @Override
                      public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                  });
                  
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });
                  
                  webView.loadUrl("https://appassets.androidplatform.net/assets/www/index.html");
                  
                  if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, 1);
                  }
              }
          }
          EOF

      - name: Compilation de l'APK avec Gradle
        run: |
          # Initialisation du wrapper Gradle
          gradle wrapper
          
          # C'EST ICI QUE CA BLOQUAIT : Donner les droits d'exécution au script
          chmod +x gradlew
          
          # Lancement de la compilation avec affichage des erreurs en cas d'échec
          ./gradlew assembleDebug --stacktrace

      - name: Téléversement de l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: OrbitalGPS-APK-Hors-Ligne
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
