name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installation de Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configuration manuelle de Bubblewrap (Anti-blocage CI/CD)
        run: |
          # Création du dossier de config caché de Bubblewrap
          mkdir -p ~/.bubblewrap
          # On écrit directement les chemins pour éviter l'assistant interactif
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF

      - name: Génération du keystore de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p twa
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Utilisation du keystore fourni dans les secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > twa/android.keystore
          else
            echo "Aucun keystore trouvé. Génération d'un keystore de debug..."
            keytool -genkeypair -v -keystore twa/android.keystore \
              -alias android -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass password -keypass password \
              -dname "CN=OrbitalGPS, O=OrbitalGPS, C=FR"
          fi

      - name: Création du fichier twa-manifest.json
        run: |
          cat > twa/twa-manifest.json <<EOF
          {
            "packageId": "com.mahmoh1960.orbitalgps",
            "host": "mahmoh1960.github.io",
            "name": "OrbitalGPS Telemetry",
            "launcherName": "OrbitalGPS",
            "display": "standalone",
            "themeColor": "#0b192c",
            "backgroundColor": "#0b192c",
            "startUrl": "/OrbitalGPS/",
            "iconUrl": "https://mahmoh1960.github.io/OrbitalGPS/icon-512.png",
            "maskableIconUrl": "https://mahmoh1960.github.io/OrbitalGPS/icon-512.png",
            "webManifestUrl": "https://mahmoh1960.github.io/OrbitalGPS/manifest.json",
            "signingKey": {
              "path": "./twa/android.keystore",
              "alias": "android"
            },
            "appVersion": "1",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "minSdkVersion": 24,
            "orientation": "portrait",
            "fallbackType": "customtabs",
            "features": {},
            "fingerprints": []
          }
          EOF

      - name: Compilation de l'APK avec Bubblewrap
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'password' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'password' }}
        run: |
          cd twa
          # On utilise --skipPwaValidation pour éviter les appels réseau bloquants si besoin
          yes | bubblewrap build --skipPwaValidation

      - name: Téléversement de l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: OrbitalGPS-APK
          path: twa/app-release-signed.apk
          retention-days: 7
