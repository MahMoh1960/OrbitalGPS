<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Générateur d'icônes OrbitalGPS</title>
<style>
  body { background: #0b192c; color: #fff; font-family: system-ui, sans-serif;
         padding: 40px 20px; text-align: center; margin: 0; }
  h1 { color: #ffcc00; font-size: 1.4rem; margin-bottom: 6px; }
  p  { color: #8aa4c4; font-size: 0.9rem; margin-bottom: 24px; }
  canvas { display: none; }
  .preview { display: inline-block; margin: 16px; vertical-align: middle; }
  .preview div { color: #8aa4c4; font-size: 0.75rem; margin-bottom: 8px; }
  .preview img { border-radius: 22%; border: 2px solid #ffcc00; display: block; }
  .btns { margin-top: 30px; }
  button {
    background: #ffcc00; color: #000; border: none;
    padding: 14px 26px; font-weight: 700; border-radius: 8px;
    margin: 6px; cursor: pointer; font-size: 0.95rem;
  }
  button:active { opacity: 0.8; }
  .hint { color: #8aa4c4; font-size: 0.75rem; margin-top: 20px; line-height: 1.5; }
</style>
</head>
<body>
<h1>Générateur d'icônes OrbitalGPS</h1>
<p>Cliquez sur les boutons pour télécharger les icônes PNG.</p>

<canvas id="c512" width="512" height="512"></canvas>
<canvas id="c192" width="192" height="192"></canvas>

<div>
  <div class="preview"><div>512 × 512</div><img id="p512" alt="icon-512"></div>
  <div class="preview"><div>192 × 192</div><img id="p192" alt="icon-192"></div>
</div>

<div class="btns">
  <button onclick="download(512)">⬇ Télécharger icon-512.png</button>
  <button onclick="download(192)">⬇ Télécharger icon-192.png</button>
</div>

<p class="hint">
  Enregistrez les deux fichiers dans le même dossier que <code>index.html</code>,<br>
  puis supprimez ce fichier <code>generate-icons.html</code> du dépôt.
</p>

<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext("2d");
  const s = canvas.width;
  const cx = s / 2;
  const cy = s / 2;

  // Fond arrondi bleu nuit
  const r = s * 0.18;
  ctx.fillStyle = "#0b192c";
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(s - r, 0);
  ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s - r);
  ctx.quadraticCurveTo(s, s, s - r, s);
  ctx.lineTo(r, s);
  ctx.quadraticCurveTo(0, s, 0, s - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();

  // Cercle extérieur jaune (boussole)
  const ringR = s * 0.38;
  ctx.strokeStyle = "#ffcc00";
  ctx.lineWidth = s * 0.03;
  ctx.beginPath();
  ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
  ctx.stroke();

  // Cercle interne discret
  const innerR = s * 0.32;
  ctx.strokeStyle = "rgba(255, 204, 0, 0.15)";
  ctx.lineWidth = s * 0.008;
  ctx.beginPath();
  ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
  ctx.stroke();

  // Croix de repère
  ctx.strokeStyle = "rgba(255, 204, 0, 0.12)";
  ctx.lineWidth = s * 0.005;
  ctx.beginPath();
  ctx.moveTo(cx - innerR, cy);
  ctx.lineTo(cx + innerR, cy);
  ctx.moveTo(cx, cy - innerR);
  ctx.lineTo(cx, cy + innerR);
  ctx.stroke();

  // Lettre N en haut
  ctx.fillStyle = "#ffcc00";
  ctx.font = "bold " + (s * 0.085) + "px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("N", cx, cy - ringR + s * 0.05);

  // Flèche verte (pointeur Qibla) vers le haut
  const arrowLen = s * 0.22;
  const arrowW = s * 0.09;
  ctx.fillStyle = "#00ff88";
  ctx.beginPath();
  ctx.moveTo(cx, cy - arrowLen);
  ctx.lineTo(cx + arrowW / 2, cy);
  ctx.lineTo(cx + arrowW * 0.3, cy);
  ctx.lineTo(cx + arrowW * 0.3, cy + arrowLen * 0.75);
  ctx.lineTo(cx - arrowW * 0.3, cy + arrowLen * 0.75);
  ctx.lineTo(cx - arrowW * 0.3, cy);
  ctx.lineTo(cx - arrowW / 2, cy);
  ctx.closePath();
  ctx.fill();

  // Point central jaune
  ctx.fillStyle = "#ffcc00";
  ctx.beginPath();
  ctx.arc(cx, cy, s * 0.03, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#07101c";
  ctx.lineWidth = s * 0.008;
  ctx.stroke();
}

drawIcon(document.getElementById("c512"));
drawIcon(document.getElementById("c192"));

document.getElementById("p512").src = document.getElementById("c512").toDataURL("image/png");
document.getElementById("p192").src = document.getElementById("c192").toDataURL("image/png");

function download(size) {
  const canvas = document.getElementById("c" + size);
  const url = canvas.toDataURL("image/png");
  const link = document.createElement("a");
  link.href = url;
  link.download = "icon-" + size + ".png";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
</script>
</body>
</html>
